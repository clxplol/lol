name: Build @Clxp

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Clxp-VST2-x64
          path: build/Release/*.dll
